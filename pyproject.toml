[project]
name = "ringier-data-eng-workshop"
version = "0.6.0"
description = "A reproducible JetClass-II particle-discovery Spark workshop"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -p no:cacheprovider"
markers = ["integration: starts a local Spark session"]

[tool.mypy]
python_version = "3.10"
files = ["src", "scripts", "site/scripts"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
cache_dir = ".cache/mypy"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
# These dependencies do not provide usable stubs in the workshop runtime.
# Sophon and Blender are optional; their imports remain optional at runtime.
module = ["pyarrow.*", "duckdb", "scipy.*", "sklearn.*", "threadpoolctl", "predict.sophon", "bpy.*", "mathutils.*", "setup_workshop"]
ignore_missing_imports = true
