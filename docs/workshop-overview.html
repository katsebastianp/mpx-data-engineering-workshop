<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code overview</title>
<style>
  :root {
    --charcoal: #282b2f;
    --panel: #30343a;
    --ink: #f6f3ed;
    --coral: #ff737a;
    --blue: #a9c7e8;
    --line: rgba(246, 243, 237, .14);
    --muted: rgba(246, 243, 237, .62);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--charcoal); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; padding: 16px 24px 4px;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .hint { font-size: 11px; color: var(--muted); }
  main {
    padding: 0 24px 24px; min-height: calc(100vh - 76px);
    display: flex; align-items: center;
  }
  svg { display: block; width: 100%; height: auto; }

  .node { cursor: pointer; outline: none; }
  .node rect {
    fill: var(--panel); stroke: var(--line); stroke-width: 1;
    transition: stroke .15s ease, fill .15s ease;
  }
  .node:hover rect, .node:focus-visible rect { stroke: rgba(255, 115, 122, .65); }
  .node[aria-pressed="true"] rect { stroke: var(--coral); stroke-width: 1.6; }
  .node:focus-visible { outline: none; }

  .label {
    fill: var(--ink); font-size: 12px; font-weight: 600;
    text-anchor: middle; letter-spacing: .01em;
  }
  .path {
    fill: var(--muted); font-family: "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 8px; text-anchor: middle; letter-spacing: .01em;
  }
  .edge { fill: none; stroke: var(--blue); stroke-width: 1.4; }
  .edge-label {
    fill: var(--blue); font-size: 9.5px; text-anchor: middle;
    letter-spacing: .02em;
  }
  .control { fill: none; stroke: var(--coral); stroke-width: 1.1; stroke-dasharray: 4 4; opacity: .8; }
  .control-label { fill: var(--coral); font-size: 9px; letter-spacing: .04em; }

  #detail {
    position: fixed; right: 20px; bottom: 20px;
    width: min(430px, calc(100vw - 40px));
    background: var(--panel); border: 1px solid rgba(255, 115, 122, .45);
    border-radius: 6px; padding: 14px 44px 14px 16px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .35);
  }
  #detail[hidden] { display: none; }
  #detail-text { font-size: 13px; line-height: 1.55; }
  #detail-close {
    position: absolute; top: 5px; right: 8px; background: none; border: 0;
    color: var(--muted); font-size: 19px; line-height: 1; cursor: pointer; padding: 2px;
  }
  #detail-close:hover, #detail-close:focus-visible { color: var(--ink); }
</style>
</head>
<body>

<header>
  <h1>Code overview</h1>
  <span class="hint">Click a node</span>
</header>

<main>
<svg id="chart" viewBox="0 0 1305 540" role="img" aria-label="Workshop code flow from raw Parquet to Model Explorer">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9c7e8"/>
    </marker>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff737a"/>
    </marker>
  </defs>

  <!-- data edges -->
  <path class="edge" d="M210,296 H235" marker-end="url(#arrow)"/>
  <path class="edge" d="M425,296 H450" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,268 L665,178" marker-end="url(#arrow)"/>
  <path class="edge" d="M640,324 L665,420" marker-end="url(#arrow)"/>
  <path class="edge" d="M855,190 L880,285" marker-end="url(#arrow)"/>
  <path class="edge" d="M855,425 L880,325" marker-end="url(#arrow)"/>
  <path class="edge" d="M1070,296 H1095" marker-end="url(#arrow)"/>
  <path class="edge" d="M760,232 V380" marker-end="url(#arrow)"/>

  <text class="edge-label" x="632" y="210" text-anchor="end">train rows</text>
  <text class="edge-label" x="632" y="370" text-anchor="end">validation rows</text>
  <text class="edge-label" x="751" y="300" transform="rotate(-90 751 300)">model</text>

  <!-- config controls -->
  <path class="control" d="M545,98 V105 H860 V455 H855" marker-end="url(#arrow-control)"/>
  <path class="control" d="M760,105 V120" marker-end="url(#arrow-control)"/>
  <text class="control-label" x="585" y="118">controls</text>

  <!-- config -->
  <g class="node" data-node="config" tabindex="0" role="button" aria-pressed="false">
    <rect x="450" y="20" width="190" height="78" rx="7"/>
    <text class="label" x="545" y="44">Config</text>
    <text class="path" x="545" y="68">config/experiments.yaml</text>
    <text class="path" x="545" y="84">src/predict/config.py</text>
  </g>

  <!-- raw -->
  <g class="node" data-node="raw" tabindex="0" role="button" aria-pressed="false">
    <rect x="20" y="240" width="190" height="112" rx="7"/>
    <text class="label" x="115" y="266">Raw Parquet</text>
    <text class="path" x="115" y="292">data/01_raw/train.parquet</text>
    <text class="path" x="115" y="308">data/01_raw/validation.parquet</text>
  </g>

  <!-- preprocessing -->
  <g class="node" data-node="prep" tabindex="0" role="button" aria-pressed="false">
    <rect x="235" y="240" width="190" height="112" rx="7"/>
    <text class="label" x="330" y="266">PySpark preprocessing</text>
    <text class="path" x="330" y="292">src/preprocessing/pipeline.py</text>
    <text class="path" x="330" y="308">src/preprocessing/features.py</text>
  </g>

  <!-- prepared -->
  <g class="node" data-node="prepared" tabindex="0" role="button" aria-pressed="false">
    <rect x="450" y="240" width="190" height="112" rx="7"/>
    <text class="label" x="545" y="266">Prepared features</text>
    <text class="path" x="545" y="292">data/02_preprocessed/</text>
    <text class="path" x="545" y="310">train.parquet · validation.parquet</text>
  </g>

  <!-- training -->
  <g class="node" data-node="training" tabindex="0" role="button" aria-pressed="false">
    <rect x="665" y="120" width="190" height="112" rx="7"/>
    <text class="label" x="760" y="146">Model training</text>
    <text class="path" x="760" y="172">src/predict/experiment.py</text>
    <text class="path" x="760" y="188">src/predict/logistic.py</text>
  </g>

  <!-- evaluation -->
  <g class="node" data-node="evaluation" tabindex="0" role="button" aria-pressed="false">
    <rect x="665" y="380" width="190" height="112" rx="7"/>
    <text class="label" x="760" y="406">Evaluation &amp; predictions</text>
    <text class="path" x="760" y="432">src/predict/experiment.py</text>
    <text class="path" x="760" y="448">src/predict/metrics.py</text>
  </g>

  <!-- results -->
  <g class="node" data-node="results" tabindex="0" role="button" aria-pressed="false">
    <rect x="880" y="240" width="190" height="112" rx="7"/>
    <text class="label" x="975" y="266">Results</text>
    <text class="path" x="975" y="292">data/03_predictions/result.json</text>
    <text class="path" x="975" y="308">data/03_predictions/*.parquet</text>
  </g>

  <!-- explorer -->
  <g class="node" data-node="explorer" tabindex="0" role="button" aria-pressed="false">
    <rect x="1095" y="240" width="190" height="112" rx="7"/>
    <text class="label" x="1190" y="266">Model Explorer</text>
    <text class="path" x="1190" y="290">data/05_analytics/</text>
    <text class="path" x="1190" y="306">model-explorer.html</text>
    <text class="path" x="1190" y="322">src/postprocessing/compare.py</text>
  </g>
</svg>
</main>

<aside id="detail" hidden aria-live="polite">
  <button id="detail-close" type="button" aria-label="Close">&times;</button>
  <div id="detail-text"></div>
</aside>

<script>
  const DETAIL = {
    raw: "Pinned train and validation Parquet inputs; pipeline.check_inputs verifies their checksums, row counts and disjoint IDs.",
    prep: "Turns raw jets into measured features; features.build_features builds the Spark plan and pipeline.prepare_data writes the splits.",
    prepared: "Reusable split tables with a checksummed manifest; pipeline._consolidate_splits writes them and predict.data.load_prepared re-verifies before fitting.",
    training: "Fits every configured model on train rows only and outputs a checksummed artifact; models.train_model dispatches to LogisticPredictor.train.",
    evaluation: "Scores validation rows and outputs metrics plus predictions, touching test only for final evaluation; experiment.run_experiments drives it.",
    results: "Per-experiment outputs result.json and predictions.parquet; experiment._save_result records metrics, timings and provenance.",
    explorer: "Collects successful results into comparison.json and model-explorer.html; compare.compare and explorer.write_explorer render it.",
    config: "Supplies run name, experiments, features, seed, max_workers and evaluation split; predict.config.read_config validates it for training and evaluation."
  };

  const panel = document.getElementById("detail");
  const panelText = document.getElementById("detail-text");
  const closeButton = document.getElementById("detail-close");
  const nodes = Array.from(document.querySelectorAll(".node"));
  let selected = null;

  function clearSelection() {
    nodes.forEach((node) => node.setAttribute("aria-pressed", "false"));
    selected = null;
  }

  function showNode(node) {
    const key = node.dataset.node;
    if (!DETAIL[key]) return;
    clearSelection();
    node.setAttribute("aria-pressed", "true");
    selected = node;
    panelText.textContent = DETAIL[key];
    panel.hidden = false;
  }

  nodes.forEach((node) => {
    node.addEventListener("click", () => showNode(node));
    node.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        showNode(node);
      }
    });
  });

  closeButton.addEventListener("click", () => {
    panel.hidden = true;
    clearSelection();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !panel.hidden) {
      panel.hidden = true;
      clearSelection();
      if (selected) selected.focus();
    }
  });

  document.getElementById("chart").addEventListener("click", (event) => {
    if (event.target.id === "chart") {
      panel.hidden = true;
      clearSelection();
    }
  });
</script>

</body>
</html>
