name: particle-workshop
services:
  setup:
    image: particle-workshop:0.6.0
    build: .
    init: true
    cpus: 2
    mem_limit: 2g
    command: ["scripts/setup_workshop.py"]
    volumes:
      - .:/workspace:ro
      - ./models:/workspace/models
  lab:
    image: particle-workshop:0.6.0
    build: .
    init: true
    cpus: 2
    mem_limit: 2g
    network_mode: none
    volumes:
      - .:/workspace:ro
      - ./data:/workspace/data
      - ./models:/workspace/models
      - ./dist:/workspace/dist
